<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Blogger</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card h1 {
      margin: 0 0 10px;
      font-size: 26px;
      color: #333;
    }
    .login-card h2 {
      margin: 0 0 20px;
      font-size: 18px;
      color: #555;
    }
    .login-card label {
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
      display: block;
      text-align: left;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: #4facfe;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .login-card button:hover {
      background: #00c6fb;
    }
    .login-card .footer {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      color: #777;
    }
    .login-card .footer a {
      color: #4facfe;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Welcome to Blogger</h1>
    <h2>Please log in to continue</h2>
    <form onsubmit="handleLogin(event)">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
      
      <button type="submit">Login</button>
    </form>
    <div class="footer">
      Don’t have an account? <a href="sign.html">Sign up</a>
    </div>
  </div>

  <script>
    function handleLogin(event){
      event.preventDefault();
      // Demo: redirect to main page
      window.location.href = "main.html";
    }
  </script>
</body>
</html>
